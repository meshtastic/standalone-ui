; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native-mui

[device-ui_base]
lib_deps =
	# renovate: datasource=git-refs depName=meshtastic/device-ui packageName=https://github.com/meshtastic/device-ui gitBranch=master
	https://github.com/meshtastic/device-ui/archive/199c0fea23fd9248a6b0fc279f320410d860522d.zip
custom_sdkconfig =
  # CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC is not set
  CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
  ; not an IDF symbol; read by extra_scripts/esp32_fatfs_exfat.py to patch ffconf.h
  CONFIG_FATFS_FS_EXFAT=y
  CONFIG_FATFS_LFN_STACK=y

; twice on purpose: the pre pass patches framework-espidf before the IDF-libs
; rebuild, the post pass re-patches the -libs headers a reinstall just wiped
extra_scripts =
  pre:extra_scripts/esp32_fatfs_exfat.py
  post:extra_scripts/esp32_fatfs_exfat.py

[env]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
upload_protocol = esp-builtin
board_build.filesystem = littlefs
extra_scripts = ./bin/littlefsbuilder.py
build_type = release
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=c++11
    -std=c++14
build_flags = -std=c++2a -std=gnu++2a -Os -ffunction-sections -fdata-sections -Wl,--gc-sections
  -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
  -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
  -DCONFIG_ARDUHAL_ESP_LOG
  -DCONFIG_ARDUHAL_LOG_COLORS=1
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_COMP_CONF_INCLUDE_SIMPLE
  -DLV_BUILD_TEST=0
  -I src
  -I src/mesh/generated
lib_deps =
  ${device-ui_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.35

; https://aliexpress.com/item/1005012346413668.html
[env:nm-cyd-c5-mui]
board = nm-cyd-c5
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
upload_protocol = esptool
debug_tool = esp-builtin
debug_init_break = tbreak setup
debug_port = /dev/ttyUSB0
build_flags = ${env.build_flags}
  -D ARCH_ESP32
  -D ESP32_NM_CYD_C5
  -D USE_ILOG
  -D USE_SERIAL1
  -D WAIT_FOR_SERIAL0
  -D SERIAL_RX=26
  -D SERIAL_TX=4
  -D SCAN_I2C_BUS_RESET
  -D BUTTON_PIN=28
  -D INPUTDRIVER_BUTTON_TYPE=28
  -D HAS_TFT=1
  -D RAM_SIZE=6144
  -D LGFX_DRIVER=LGFX_ESP_NM_CYD_C5
  -D VIEW_320x240
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D HAS_SDCARD
  -D SD_SPI_FREQUENCY=75000000
  -D MAP_FULL_REDRAW
  -D CALIBRATE_TOUCH=0
  -I lib
  -I lib/mesh/generated
  -I variants/nm-cyd-c5
  -I ${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32c5/include/freertos/FreeRTOS-Kernel/include/freertos
lib_deps = ${env.lib_deps}
  LittleFS

custom_sdkconfig =
  ${device-ui_base.custom_sdkconfig}

extra_scripts =
  ${device-ui_base.extra_scripts}


